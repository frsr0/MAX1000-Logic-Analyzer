name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run tests
        run: >-
          python -m pytest tests/ driver/tests/ -v --tb=short
          --cov=app --cov=driver --cov-branch
          --cov-config=../pyproject.toml
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=100

      - name: Upload host coverage
        uses: actions/upload-artifact@v4
        with:
          name: host-coverage
          path: host/coverage.xml

      - name: Run lint (syntax check)
        run: |
          python -m compileall app/ driver/ tests/ driver/tests/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for SPA-backed API tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Run backend tests
        run: >-
          python -m pytest app/tests -v --tb=short
          --cov=app --cov-branch
          --cov-config=../pyproject.toml
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=100

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Run unit coverage
        run: npm run test:unit

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mock E2E suite
        env:
          PLAYWRIGHT_USE_MOCK: "1"
        run: npm run test:e2e -- hardware.spec.ts

  hdl-tb:
    runs-on: ubuntu-latest
    # Pinned GHDL toolchain (ubuntu-22.04 base with bash as the default
    # shell, so the plain `run` steps work unchanged). Running inside the
    # verified container removes the apt-version skew of a bare
    # `apt-get install ghdl` and keeps the CI bit-for-bit on the same
    # compiler as the local container runs (GHDL 6.0.0, --std=08).
    container: ghdl/ghdl:6.0.0-llvm-ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run HDL testbench suite
        run: bash hdl/tb/run_all_tbs.sh
